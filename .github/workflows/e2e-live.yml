name: E2E Live (hpn-test-store)

# Buyer-flow browser tests against the real hpn-test-store storefront and the deployed
# app. Required to pass: there is no continue-on-error and no skipping. It is a separate
# workflow because it depends on external state (seeded offers, Shopify bot protection,
# the Vercel deployment of the pushed commit), so it must not run per pull request.
#
# Never point this at the live HPN, TRU, Ambrosia or One Sol stores. The seed and
# verify scripts only ever touch hpn-test-store.myshopify.com.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      grep:
        description: "Only run tests whose title matches this pattern"
        required: false
        default: ""
      mobile:
        description: "Also run the mobile viewport project"
        type: boolean
        default: false

# One store, one cart-API budget per runner IP: runs queue instead of overlapping.
concurrency:
  group: e2e-live
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

jobs:
  storefront:
    name: Storefront E2E
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 60
    env:
      CI: "true"
      DEV_STORE_URL: ${{ secrets.DEV_STORE_URL }}
      DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
      APP_URL: ${{ secrets.APP_URL }}
      E2E_PRODUCT_HANDLE: ${{ secrets.E2E_PRODUCT_HANDLE }}
      E2E_BUNDLE_PRODUCT_HANDLE: ${{ secrets.E2E_BUNDLE_PRODUCT_HANDLE }}
      E2E_VOLUME_PRODUCT_HANDLE: ${{ secrets.E2E_VOLUME_PRODUCT_HANDLE }}
      E2E_QUALIFYING_VARIANT_ID: ${{ secrets.E2E_QUALIFYING_VARIANT_ID }}
      E2E_MOBILE: ${{ inputs.mobile && '1' || '' }}
    steps:
      - name: Check required secrets
        run: |
          missing=""
          for name in DEV_STORE_URL DEV_STORE_PASSWORD APP_URL E2E_PRODUCT_HANDLE E2E_BUNDLE_PRODUCT_HANDLE E2E_VOLUME_PRODUCT_HANDLE E2E_QUALIFYING_VARIANT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets in the 'e2e' environment:$missing. Refusing to report green without browser tests."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Wait for the Vercel deployment of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tests hit the deployed app, so a push must wait for its own deployment.
          for i in $(seq 1 80); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
              --jq '[.statuses[] | select(.context | test("^Vercel.*freebies-app-shopify-admin$"))][0].state // "missing"')
            case "$state" in
              success) echo "Vercel deployment is ready."; exit 0 ;;
              failure|error) echo "::error::The Vercel deployment of $GITHUB_SHA failed; E2E would test stale code."; exit 1 ;;
            esac
            echo "Vercel deployment state: $state (attempt $i)"
            sleep 30
          done
          echo "::error::Timed out waiting for the Vercel deployment of $GITHUB_SHA."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Seed and verify E2E fixtures
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.E2E_TOKEN_ENCRYPTION_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$TOKEN_ENCRYPTION_KEY" ]; then
            echo "::warning::E2E_DATABASE_URL / E2E_TOKEN_ENCRYPTION_KEY are not set, so fixtures are NOT re-seeded. Global setup still probes the live store and fails with the exact repair command if an offer is missing. Add both secrets to the 'e2e' environment to make runs self-healing (see docs/RUNBOOK.md, E2E section)."
            exit 0
          fi
          pnpm seed:ambrosia-e2e
          pnpm verify:ambrosia-e2e

      - run: pnpm --filter shopify-admin exec playwright install --with-deps chromium

      - name: Run storefront E2E
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: pnpm --filter shopify-admin test:e2e ${E2E_GREP:+--grep "$E2E_GREP"}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/shopify-admin/playwright-report
            apps/shopify-admin/test-results
          retention-days: 7
