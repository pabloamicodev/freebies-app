name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript & Unit Tests ──────────────────────────────────────────────────
  typescript:
    name: TypeScript + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Build admin app
        run: pnpm --filter shopify-admin build
        env:
          SHOPIFY_API_KEY: ci-placeholder
          SHOPIFY_API_SECRET: ci-placeholder
          SHOPIFY_APP_URL: https://ci-placeholder.example.com
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NODE_ENV: development
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info

  # ── Rust Functions ───────────────────────────────────────────────────────────
  rust-functions:
    name: Rust Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests (all functions)
        run: cargo test --workspace --release
      - name: Build WASM binaries
        run: cargo build --workspace --release --target wasm32-wasip1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate complete Shopify app bundle
        run: pnpm shopify:build
      - name: Check binary sizes
        run: |
          # Measure the optimized artifacts Shopify uploads, not the raw cargo output.
          shopt -s nullglob
          wasms=(apps/shopify-admin/extensions/*/target/wasm32-wasip1/release/*.wasm)
          [ ${#wasms[@]} -gt 0 ] || { echo "❌ No optimized function binaries found"; exit 1; }
          for wasm in "${wasms[@]}"; do
            size=$(wc -c < "$wasm")
            kb=$((size / 1024))
            name=$(basename "$wasm")
            echo "${name}: ${kb} KB"
            if [ "$kb" -gt 256 ]; then
              echo "❌ ${name} exceeds 256 KB limit"
              exit 1
            fi
          done
          echo "✅ All binaries within size limits"

  # ── Storefront Bundle Size ───────────────────────────────────────────────────
  bundle-size:
    name: Storefront Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build storefront runtime
        run: pnpm --filter @promo/storefront-runtime build
      - name: Check bundle sizes
        run: node scripts/check-bundle-sizes.mjs

  # ── ESLint ───────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ── E2E Tests ────────────────────────────────────────────────────────────────
  # Required production gate: missing storefront configuration or fixtures fail
  # the job. Admin credentials are intentionally unnecessary for buyer-flow E2E.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment: e2e
    env:
      DEV_STORE_URL: ${{ secrets.DEV_STORE_URL }}
      DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
      APP_URL: ${{ secrets.APP_URL }}
      E2E_PRODUCT_HANDLE: ${{ secrets.E2E_PRODUCT_HANDLE }}
      E2E_BUNDLE_PRODUCT_HANDLE: ${{ secrets.E2E_BUNDLE_PRODUCT_HANDLE }}
      E2E_VOLUME_PRODUCT_HANDLE: ${{ secrets.E2E_VOLUME_PRODUCT_HANDLE }}
      E2E_QUALIFYING_VARIANT_ID: ${{ secrets.E2E_QUALIFYING_VARIANT_ID }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DEV_STORE_URL" ] || [ -z "$APP_URL" ] || [ -z "$E2E_PRODUCT_HANDLE" ] || [ -z "$E2E_BUNDLE_PRODUCT_HANDLE" ] || [ -z "$E2E_VOLUME_PRODUCT_HANDLE" ] || [ -z "$E2E_QUALIFYING_VARIANT_ID" ]; then
            echo "::error::E2E secrets are required; refusing to report a green build without browser tests."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shopify-admin exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter shopify-admin test:e2e
