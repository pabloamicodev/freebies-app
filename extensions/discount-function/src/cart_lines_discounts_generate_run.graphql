query Input {
  discount {
    discountClasses
    metafield(namespace: "promo_engine", key: "function_config") {
      value
    }
  }
  cart {
    sourceAttribute: attribute(key: "source") {
      value
    }
    buyerIdentity {
      customer {
        numberOfOrders
        amountSpent {
          amount
        }
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
        subtotalAmount {
          amount
        }
        totalAmount {
          amount
        }
      }
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            volumeDiscountTiers: metafield(namespace: "custom", key: "volume_discount_tiers") {
              value
            }
          }
        }
      }
      lineType: attribute(key: "_promo_engine_line_type") {
        value
      }
      offerId: attribute(key: "_promo_engine_offer_id") {
        value
      }
      rewardId: attribute(key: "_promo_engine_reward_id") {
        value
      }
      offerVersion: attribute(key: "_promo_engine_offer_version") {
        value
      }
      volumeDiscountBundleItem: attribute(key: "_bundle_item") {
        value
      }
      volumeDiscountNektarGlp1: attribute(key: "_nektar_glp1") {
        value
      }
      landingSource: attribute(key: "__landing_source") {
        value
      }
      bundleType: attribute(key: "__bundle_type") {
        value
      }
      quizBundleId: attribute(key: "_quiz_bundle_id") {
        value
      }
      quizTargetCents: attribute(key: "_quiz_target_cents") {
        value
      }
      quizExpectedPaidCount: attribute(key: "_quiz_expected_paid_count") {
        value
      }
      quizFreeGift: attribute(key: "_quiz_free_gift") {
        value
      }
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
  }
}
