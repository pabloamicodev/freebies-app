[package]
name = "promo-engine-discount-function"
version = "0.1.0"
edition = "2021"

[dependencies]
shopify_function = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"   # Optimize aggressively for the Shopify 256 KB WASM limit
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
