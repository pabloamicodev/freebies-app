query CartTransformInput {
  cart {
    lines {
      id
      quantity
      lineType: attribute(key: "_promo_engine_line_type") { value }
      bundleComponents: attribute(key: "_promo_engine_bundle_components") { value }
      bundleTitle: attribute(key: "_promo_engine_bundle_title") { value }
      bundleImageUrl: attribute(key: "_promo_engine_bundle_image_url") { value }
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
    }
  }
}
