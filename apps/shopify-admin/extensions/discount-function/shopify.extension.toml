api_version = "2026-07"

[[extensions]]
name = "Promo Engine Discount"
handle = "promo-engine-discount"
type = "function"
uid = "e1779323-ec7a-4f39-ba24-b562345ed2b3"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart_lines_discounts_generate_run"

  [extensions.build]
  # 249000 leaves room for the ~13KB trampoline the Shopify CLI adds before its 256KB upload check.
  command = "node ../../../../scripts/build-shopify-function.mjs target/wasm32-wasip1/release/promo-engine-discount-function.wasm 249000"
  path = "target/wasm32-wasip1/release/promo-engine-discount-function.wasm"
  watch = ["src/**/*.rs"]

  [extensions.input.variables]
  namespace = "promo_engine"
  key = "function_config"
