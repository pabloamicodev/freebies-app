[package]
name = "promo-engine-code-discount-function"
version = "0.1.0"
edition = "2021"

[dependencies]
shopify_function = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[features]
# Enables the code-gated paths in the shared discount-function sources.
default = ["code_gate"]
code_gate = []
